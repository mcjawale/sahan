{% extends "base.html" %}
{% block title %}Account - {{ APP_NAME }}{% endblock %}
{% block heading %}Account Settings{% endblock %}
{% block content %}
<div class="panel" style="max-width:480px">
  <h2>Change Password</h2>
  <form method="post">
    <div class="field" style="margin-bottom:12px">
      <label>Current password</label>
      <input type="password" name="current_password" required style="width:100%">
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>New password (min 6 characters)</label>
      <input type="password" name="new_password" required style="width:100%">
    </div>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
