services:
  - type: web
    name: sahan-fleet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_LOGIN
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
